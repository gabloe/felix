\* The same model with promotion by log order: the live replica whose
\* (last generation, length) is greatest, which is Raft's election restriction.
SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 7
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "log-order"

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
