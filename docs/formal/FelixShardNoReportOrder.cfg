\* The design WITHOUT report-before-mark: a leader may acknowledge under
\* Quorum before the control plane has been told which replica holds the
\* record. This is what the broker did before #268, and TLC finds the trace:
\* the leader ships to one follower, acknowledges, dies before reporting, and
\* the control plane promotes the other follower from a report that predates
\* the acknowledgement.
\*
\* Expected to violate AckedSurvive. That is what makes the ordering in
\* `publish_mark` demonstrably load-bearing rather than merely present.
SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 7
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
