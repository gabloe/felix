\* The design as implemented, with the control plane free to move the shard
\* off a live leader: fence, wait for the leader's drained report, cut over.
\* Synchronised clocks, since nothing about the handoff depends on drift.
\*
\* `WaitForDrained = FALSE` is the same design cutting over as soon as the
\* fence is written, in FelixShardHandoffNoWait.cfg, and it commits a write
\* at a superseded generation.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_draining_assignment_stops_serving_and_stays_stopped` -- ObserveFence: a
\*   broker never serves a draining assignment, however often it is delivered.
\* `a_draining_shard_reports_drained_once_its_tail_holds_still` -- the drained
\*   report: sent only once the log has stopped growing with nothing in flight.
\* `a_fenced_shard_waits_for_the_leader_to_report_drained` -- WaitForDrained:
\*   placement does not cut over on a report from before the fence, or on none.
\* `a_drained_report_cuts_over_to_the_successor` -- CutOver: the successor is
\*   named only from a drained report that lists it caught up.
\* `records_acknowledged_during_a_move_survive_it` -- AckedSurvive across a
\*   move, against a real cluster, with the old owner refusing to write
\*   locally once the successor is named.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 5
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    MaxMoves = 1

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
