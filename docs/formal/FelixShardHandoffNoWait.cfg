\* A planned handoff that names the successor as soon as the fence is
\* written, without waiting for the leader to say it has stopped. The leader
\* has not seen the fence yet when the successor starts serving.
\*
\* Expected to violate AtMostOneServing, in five steps. That is what makes
\* the drained report load-bearing rather than a courtesy.
\* Evidence: this configuration REMOVES a wait the implementation has, so the
\* citation is what proves the wait is there to remove.
\* `a_fenced_shard_waits_for_the_leader_to_report_drained` -- placement holds
\*   a fenced shard until the drained report arrives at the fenced generation.

