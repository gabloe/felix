\* The design with its second lease check removed. TLC is expected to find
\* the paused broker that commits after its epoch ended; this configuration
\* exists to show the check is load-bearing, and `task tla:check` expects it
\* to fail.
\* Evidence: this configuration REMOVES a check the implementation has, so the
\* citation is what proves the check is there to remove.
\* `a_broker_suspended_past_expiry_fails_the_commit_check_while_admission_still_passes`
\*   -- the commit-time lease check this drops is real in the code.
\* `a_resumed_leader_does_not_acknowledge_writes_the_cluster_loses` -- and the
\*   same property against a real cluster, by freezing a leader past its lease.

