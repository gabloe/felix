\* The lease with no safety interval at all: the broker serves until its own
\* expiry and the control plane grants again the moment its copy lapses. With
\* drifting clocks TLC is expected to find two brokers serving at once; this
\* configuration exists to show the interval is load-bearing, and
\* `task tla:check` expects it to fail.
SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 8
    MaxWrites = 0
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = TRUE

SYMMETRY Symm

INVARIANTS
    AtMostOneServing
