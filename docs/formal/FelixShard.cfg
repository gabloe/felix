\* The design as implemented: both lease checks, Quorum acknowledgements
\* released only after the report describing them has landed, and promotion
\* from the leader's last report.
\*
\* `ReportBeforeAck = FALSE` is the same design without that ordering, in
\* FelixShardNoReportOrder.cfg, and it loses an acknowledged record.
SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 7
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
