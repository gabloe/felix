<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Segment file layout with its sparse index">

  <style>
    .box   { stroke: var(--edge); stroke-width: 1.25; }
    .hdr   { fill: var(--c-id); }
    .rec   { fill: var(--c-data); }
    .idx   { fill: var(--c-len); }
    .seal  { fill: var(--c-res); }
    .lbl   { fill: var(--ink); font: 500 13px ui-sans-serif, system-ui, -apple-system, sans-serif; text-anchor: middle; }
    .mono  { fill: var(--ink); font: 500 12px ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; text-anchor: middle; }
    .sub   { fill: var(--ink-dim); font: 400 11px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
    .title { fill: var(--ink); font: 600 14px ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .note  { fill: var(--ink-dim); font: 400 12px ui-sans-serif, system-ui, sans-serif; }
    .link  { stroke: var(--edge-dim); stroke-width: 1.25; fill: none; }
    .seek  { stroke: var(--accent); stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .seekT { fill: var(--accent); font: 500 11px ui-sans-serif, system-ui, sans-serif; }
    .arrow { fill: var(--accent); }
    .dash  { stroke-dasharray: 5 4; }

    :root {
      --ink: #1a2b40; --ink-dim: #5b6b7f;
      --edge: #4a6fa5; --edge-dim: #aab6c6; --accent: #b0653a;
      --c-id: #dbe6f7; --c-len: #d6ecf5; --c-data: #e3f0e7; --c-res: #eceff3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #dfe8f3; --ink-dim: #9aabbf;
        --edge: #6d94cc; --edge-dim: #46536a; --accent: #d99a6c;
        --c-id: #24344b; --c-len: #1f3a45; --c-data: #223a2c; --c-res: #262c36;
      }
    }
    :root[data-theme="dark"] {
      --ink: #dfe8f3; --ink-dim: #9aabbf;
      --edge: #6d94cc; --edge-dim: #46536a; --accent: #d99a6c;
      --c-id: #24344b; --c-len: #1f3a45; --c-data: #223a2c; --c-res: #262c36;
    }
    :root[data-theme="light"] {
      --ink: #1a2b40; --ink-dim: #5b6b7f;
      --edge: #4a6fa5; --edge-dim: #aab6c6; --accent: #b0653a;
      --c-id: #dbe6f7; --c-len: #d6ecf5; --c-data: #e3f0e7; --c-res: #eceff3;
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <text class="title" x="40" y="26">Segment file and the index beside it</text>
  <text class="sub" x="40" y="46" style="text-anchor:start">A read binary-searches the index, then decodes forward at most one spacing interval.</text>
  <rect class="box hdr" x="40" y="96" width="96" height="62" rx="3"/>
  <text class="mono" x="88.0" y="124">header</text>
  <text class="sub" x="88.0" y="140">32 B</text>
  <rect class="box rec" x="136" y="96" width="102" height="62" rx="3"/>
  <text class="mono" x="187.0" y="122">rec 0</text>
  <text class="sub" x="187.0" y="138">hdr + payload</text>
  <rect class="box rec" x="238" y="96" width="88" height="62" rx="3"/>
  <text class="mono" x="282.0" y="122">rec 1</text>
  <text class="sub" x="282.0" y="138">hdr + payload</text>
  <rect class="box rec" x="326" y="96" width="124" height="62" rx="3"/>
  <text class="mono" x="388.0" y="122">rec 2</text>
  <text class="sub" x="388.0" y="138">hdr + payload</text>
  <rect class="box rec" x="450" y="96" width="96" height="62" rx="3"/>
  <text class="mono" x="498.0" y="122">rec 3</text>
  <text class="sub" x="498.0" y="138">hdr + payload</text>
  <rect class="box rec" x="546" y="96" width="110" height="62" rx="3"/>
  <text class="mono" x="601.0" y="122">rec 4</text>
  <text class="sub" x="601.0" y="138">hdr + payload</text>
  <rect class="box rec" x="656" y="96" width="92" height="62" rx="3"/>
  <text class="mono" x="702.0" y="122">rec 5</text>
  <text class="sub" x="702.0" y="138">hdr + payload</text>
  <rect class="box seal dash" x="748" y="96" width="62" height="62" rx="3"/>
  <text class="sub" x="779.0" y="126">preallocated</text>
  <text class="sub" x="779.0" y="140">(trimmed on seal)</text>
  <text class="lbl" x="40" y="84" style="text-anchor:start">00000000000000000007.log</text>
  <text class="lbl" x="40" y="204" style="text-anchor:start">00000000000000000007.index</text>
  <rect class="box idx" x="40" y="216" width="168" height="46" rx="3"/>
  <text class="mono" x="124.0" y="236">offset 0 → position</text>
  <text class="sub" x="124.0" y="252">16 B entry</text>
  <path class="seek" d="M 124.0 216 C 124.0 176, 136 208, 136 162"/>
  <rect class="box idx" x="222" y="216" width="168" height="46" rx="3"/>
  <text class="mono" x="306.0" y="236">offset 3 → position</text>
  <text class="sub" x="306.0" y="252">16 B entry</text>
  <path class="seek" d="M 306.0 216 C 306.0 176, 326 208, 326 162"/>
  <rect class="box idx" x="404" y="216" width="168" height="46" rx="3"/>
  <text class="mono" x="488.0" y="236">offset 6 → position</text>
  <text class="sub" x="488.0" y="252">16 B entry</text>
  <path class="seek" d="M 488.0 216 C 488.0 176, 656 208, 656 162"/>
  <text class="note" x="40" y="314">One entry every index_spacing_bytes. Entries are never trusted on their own — they are a starting position for a scan that re-validates real records.</text>
</svg>
