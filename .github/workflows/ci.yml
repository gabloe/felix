name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Dockerfiles, built on every change that could break them.
  #
  # The release workflow builds these too, but only on a tag — which would mean
  # discovering a broken Dockerfile at the moment of a release. amd64 only here:
  # arm64 is emulated and slow, and what a PR needs to know is whether the file
  # still describes a working build. The multi-arch build stays on the tag.
  images:
    name: Container images build
    runs-on: ubuntu-latest
    # Changing a comment in the broker should not rebuild two container images,
    # but changing anything either binary compiles from should.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: felix-broker
            dockerfile: docker/broker.Dockerfile
          - image: felix-controlplane
            dockerfile: docker/controlplane.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          # Loaded into the local daemon so the smoke test below can run it.
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}

      - name: It runs, serves /ready, and is not root
        run: |
          set -euo pipefail
          # A build that succeeds and an image that runs are different claims,
          # and neither binary takes --help — both are env-driven — so the only
          # honest check is to start one and look.
          #
          # Neither needs anything external to come up: the broker skips
          # membership without FELIX_CONTROLPLANE_URL, and the control plane
          # runs on its in-memory store.
          docker run -d --name smoke \
            -e FELIX_CONTROLPLANE_STORAGE_BACKEND=memory \
            ${{ matrix.image }}:ci

          # Still up after a moment. This is what catches a missing shared
          # library, a bad entrypoint, or a binary that exits on startup —
          # each of which a successful build says nothing about.
          sleep 5
          running="$(docker inspect -f '{{.State.Running}}' smoke)"
          if [ "$running" != "true" ]; then
            echo "::error::${{ matrix.image }} exited instead of running"
            docker logs smoke
            exit 1
          fi

          # The metrics server is up, which is what the HEALTHCHECK and every
          # Kubernetes probe in the deployment docs depend on.
          docker exec smoke wget -qO- http://127.0.0.1:8080/ready > /dev/null

          # Non-root, at the uid the deployment docs tell operators to set.
          uid="$(docker exec smoke id -u)"
          test "$uid" = "65532" || {
            echo "::error::image runs as uid $uid, not 65532"
            exit 1
          }

          docker logs smoke
          docker rm -f smoke

  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FELIX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 55432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          # Authenticated, so this reads the repo's 1000/hr budget rather than
          # the 60/hr GitHub allows an unauthenticated IP. Runners share their
          # IP, so the anonymous budget is routinely spent by other jobs and the
          # install fails with "API rate limit exceeded" before any code runs.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: cargo-deny
        run: task deny

      - name: Publish-readiness and licence split
        run: task publish:check

      # A doc citing a test is broken by renaming the *test*, which is a Rust
      # change on a Rust pull request -- so it is checked here rather than only
      # in the docs-site build, which runs on pushes to main that touch
      # docs-site/ and would never see it.
      - name: Documentation evidence
        run: task docs:evidence

      # Demos under demos/ that declare their own [workspace] are excluded from the
      # repository workspace, so `task lint` and `task test` never reach them and
      # they can break silently. Build all three, and run the slow-consumer demo's
      # tests: its isolation assertion is a behavioural regression test for the
      # property Felix's one-line description rests on.
      - name: Standalone demo crates
        run: task demo:check

      - name: RSA dependency check (non-controlplane crates)
        run: task deny:rsa:default
