name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      FELIX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 55432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Task
        uses: arduino/setup-task@v3

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: cargo-deny
        run: task deny

      - name: Publish-readiness and licence split
        run: task publish:check

      # Demos under demos/ that declare their own [workspace] are excluded from the
      # repository workspace, so `task lint` and `task test` never reach them and
      # they can break silently. Build all three, and run the slow-consumer demo's
      # tests: its isolation assertion is a behavioural regression test for the
      # property Felix's one-line description rests on.
      - name: Standalone demo crates
        run: task demo:check

      - name: RSA dependency check (non-controlplane crates)
        run: task deny:rsa:default
