<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="The same application against one Felix cluster. Where the previous picture had three separate systems, there is now one box holding a single append-only log. A write travels once from the service into that log and is recorded as order 42 paid. Three readings then light up beside the same log: a stream that hands every record to subscribers, a cache that answers with the newest value for a key, and a queue that hands a record to one worker and holds it there until that worker reports done, at which point it moves on. A second write records order 42 as refunded, and all three readings move to it together, because there is only one copy of the fact and no second place to send it to. The closing frame shows what is being operated: one replication model, one security model, one failure model, and no glue code between systems. A note records that a deployment is brokers plus a control plane, which is two kinds of process rather than one.">

  <style>
    .tag   { fill: var(--ink-dim); font: 600 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .09em; }
    .name  { fill: var(--ink); font: 600 13px ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: .04em; }
    .body  { fill: var(--ink-dim); font: 400 13px ui-sans-serif, system-ui, sans-serif; }
    .small { fill: var(--ink-dim); font: 500 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .note  { fill: var(--ink-dim); font: 400 11px ui-sans-serif, system-ui, sans-serif; }
    .good  { fill: var(--okay); font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .box   { stroke: var(--edge); stroke-width: 1.25; fill: none; }
    .app   { stroke: var(--edge); stroke-width: 1.25; fill: var(--c-hdr); }
    .read  { stroke: var(--edge); stroke-width: 1.25; fill: var(--c-step); }
    .wire  { stroke: var(--edge-dim); stroke-width: 1.25; fill: none; }
    .spine { stroke: var(--edge-dim); stroke-width: 1.25; }
    .rec   { stroke: var(--edge); stroke-width: 1.25; fill: var(--c-step); }
    .dot   { fill: var(--edge); }
    .tick  { stroke: var(--okay); stroke-width: 2; fill: none; stroke-linecap: round; }

    :root {
      --ink:#1a2b40; --ink-dim:#5b6b7f; --edge:#4a6fa5; --edge-dim:#aab6c6;
      --accent:#b0653a; --okay:#3f7a52; --c-step:#e8f0fe; --c-hdr:#dfe6f5;
    }
    @media (prefers-color-scheme: dark) { :root {
      --ink:#dfe8f3; --ink-dim:#9aabbf; --edge:#6d94cc; --edge-dim:#46536a;
      --accent:#d99a6c; --okay:#7fbf95; --c-step:#24344b; --c-hdr:#1c2839; } }
    :root[data-theme="dark"] {
      --ink:#dfe8f3; --ink-dim:#9aabbf; --edge:#6d94cc; --edge-dim:#46536a;
      --accent:#d99a6c; --okay:#7fbf95; --c-step:#24344b; --c-hdr:#1c2839; }
    :root[data-theme="light"] {
      --ink:#1a2b40; --ink-dim:#5b6b7f; --edge:#4a6fa5; --edge-dim:#aab6c6;
      --accent:#b0653a; --okay:#3f7a52; --c-step:#e8f0fe; --c-hdr:#dfe6f5; }

    /* The same 24s loop as three-stack.svg, so the pair reads as before/after. */
    .hide { opacity: 0; }

    .s0 { animation: s0 24s infinite; } @keyframes s0 { 0%,2% { opacity:0 } 5%,96% { opacity:1 } 98%,100% { opacity:0 } }

    /* One write, one place to put it. */
    .d1 { animation: d1 24s infinite; }
    @keyframes d1 {
      0%,14%  { opacity: 0; transform: translate(0px, 0px) }
      16%     { opacity: 1; transform: translate(0px, 0px) }
      22%     { opacity: 1; transform: translate(300px, 0px) }
      23%,100% { opacity: 0; transform: translate(300px, 0px) }
    }
    .rec1 { animation: rec1 24s infinite; } @keyframes rec1 { 0%,22% { opacity:0 } 24%,96% { opacity:1 } 98%,100% { opacity:0 } }

    /* The three readings, appearing in turn over the same record. */
    .rd1 { animation: rd1 24s infinite; } @keyframes rd1 { 0%,27% { opacity:0 } 30%,96% { opacity:1 } 98%,100% { opacity:0 } }
    .rd2 { animation: rd2 24s infinite; } @keyframes rd2 { 0%,33% { opacity:0 } 36%,96% { opacity:1 } 98%,100% { opacity:0 } }
    .rd3 { animation: rd3 24s infinite; } @keyframes rd3 { 0%,39% { opacity:0 } 42%,96% { opacity:1 } 98%,100% { opacity:0 } }

    /* What the queue reading is actually doing: holding one record until the
       worker answers, then moving on. Same log, different way of reading it. */
    .q1 { animation: q1 24s infinite; } @keyframes q1 { 0%,43% { opacity:0 } 45%,62% { opacity:1 } 63%,100% { opacity:0 } }
    .q2 { animation: q2 24s infinite; } @keyframes q2 { 0%,63% { opacity:0 } 65%,96% { opacity:1 } 98%,100% { opacity:0 } }

    /* The second write. One record, and every reading moves with it. */
    .d2 { animation: d2 24s infinite; }
    @keyframes d2 {
      0%,50%  { opacity: 0; transform: translate(0px, 0px) }
      52%     { opacity: 1; transform: translate(0px, 0px) }
      58%     { opacity: 1; transform: translate(300px, 0px) }
      59%,100% { opacity: 0; transform: translate(300px, 0px) }
    }
    .rec2 { animation: rec2 24s infinite; } @keyframes rec2 { 0%,58% { opacity:0 } 60%,96% { opacity:1 } 98%,100% { opacity:0 } }
    .agree { animation: agree 24s infinite; } @keyframes agree { 0%,66% { opacity:0 } 69%,96% { opacity:1 } 98%,100% { opacity:0 } }
    .gain  { animation: gain 24s infinite; } @keyframes gain { 0%,80% { opacity:0 } 83%,96% { opacity:1 } 98%,100% { opacity:0 } }

    .c1 { animation: c1 24s infinite; } @keyframes c1 { 0%,3% { opacity:0 } 6%,25% { opacity:1 } 26%,100% { opacity:0 } }
    .c2 { animation: c2 24s infinite; } @keyframes c2 { 0%,26% { opacity:0 } 29%,48% { opacity:1 } 49%,100% { opacity:0 } }
    .c3 { animation: c3 24s infinite; } @keyframes c3 { 0%,49% { opacity:0 } 52%,68% { opacity:1 } 69%,100% { opacity:0 } }
    .c4 { animation: c4 24s infinite; } @keyframes c4 { 0%,69% { opacity:0 } 72%,96% { opacity:1 } 98%,100% { opacity:0 } }

    @media (prefers-reduced-motion: reduce) {
      .s0,.d1,.d2,.rec1,.rec2,.rd1,.rd2,.rd3,.q1,.q2,.agree,.gain,
      .c1,.c2,.c3,.c4 { animation: none; }
      .s0,.rec1,.rec2,.rd1,.rd2,.rd3,.q2,.agree,.gain { opacity: 1; }
      .c4 { opacity: 1; }
    }
  </style>

  <text class="tag" x="450" y="28" text-anchor="middle">THE SAME SERVICE ON FELIX — ONE LOG, READ THREE WAYS</text>

  <!-- ============================== application ============================== -->
  <rect class="app" x="60" y="155" width="155" height="84" rx="6"/>
  <text class="name" x="137" y="190" text-anchor="middle">YOUR SERVICE</text>
  <text class="small" x="137" y="210" text-anchor="middle">one thing to write</text>
  <text class="small" x="137" y="224" text-anchor="middle">one place to put it</text>

  <!-- ================================= the wire ============================== -->
  <!-- Straight into the log: the write has one destination, so the path is a
       line rather than a fan. -->
  <path class="wire" d="M 215 197 L 515 197"/>
  <text class="note" x="365" y="188" text-anchor="middle">one connection</text>

  <!-- ============================== the felix box ============================ -->
  <g class="hide s0">
    <rect class="box" x="520" y="88" width="300" height="318" rx="8"/>
    <text class="name" x="540" y="116">ONE FELIX CLUSTER</text>
    <text class="note" x="540" y="134">one system — the same rules for all three</text>

    <!-- the log itself -->
    <text class="small" x="540" y="164">one append-only log</text>
    <line class="spine" x1="540" y1="196" x2="800" y2="196"/>
  </g>

  <rect class="rec hide rec1" x="545" y="176" width="110" height="40" rx="4"/>
  <text class="small hide rec1" x="600" y="200" text-anchor="middle">order-42 paid</text>

  <rect class="rec hide rec2" x="667" y="176" width="126" height="40" rx="4"/>
  <text class="small hide rec2" x="730" y="200" text-anchor="middle">order-42 refunded</text>

  <!-- the three readings of it -->
  <g class="hide rd1">
    <rect class="read" x="540" y="240" width="260" height="42" rx="5"/>
    <text class="name" x="556" y="258" style="font-size: 12px">STREAM</text>
    <text class="note" x="556" y="274">every record, to everyone watching</text>
  </g>
  <g class="hide rd2">
    <rect class="read" x="540" y="292" width="260" height="42" rx="5"/>
    <text class="name" x="556" y="310" style="font-size: 12px">CACHE</text>
    <text class="note" x="556" y="326">the newest value for a key</text>
  </g>
  <g class="hide rd3">
    <rect class="read" x="540" y="344" width="260" height="42" rx="5"/>
    <text class="name" x="556" y="362" style="font-size: 12px">QUEUE</text>
  </g>
  <text class="note hide q1" x="556" y="378">handed to one worker, who still has it</text>
  <text class="note hide q2" x="556" y="378" style="fill: var(--okay)">worker says done — on to the next</text>

  <!-- the writes moving -->
  <circle class="dot hide d1" cx="215" cy="197" r="6"/>
  <circle class="dot hide d2" cx="215" cy="197" r="6"/>

  <!-- nothing to disagree about -->
  <g class="hide agree">
    <path class="tick" d="M 810 258 l 6 7 l 12 -15"/>
    <path class="tick" d="M 810 310 l 6 7 l 12 -15"/>
    <path class="tick" d="M 810 362 l 6 7 l 12 -15"/>
    <text class="good" x="670" y="230" text-anchor="middle">one copy of the fact — nothing to sync</text>
  </g>

  <g class="hide gain">
    <text class="good" x="137" y="266" text-anchor="middle">1 replication model</text>
    <text class="good" x="137" y="284" text-anchor="middle">1 security model</text>
    <text class="good" x="137" y="302" text-anchor="middle">1 failure model</text>
    <text class="note" x="137" y="326" text-anchor="middle">brokers plus a control plane —</text>
    <text class="note" x="137" y="340" text-anchor="middle">two kinds of process, not one</text>
  </g>

  <!-- ================================ captions =============================== -->
  <text class="body hide c1" x="450" y="430" text-anchor="middle">The same service, against one cluster. The write goes to one place, once.</text>
  <text class="body hide c2" x="450" y="430" text-anchor="middle">Stream, cache and queue are not three systems here. They are three ways of reading the same records.</text>
  <text class="body hide c3" x="450" y="430" text-anchor="middle">A second write is one record again — there is no second system to copy it into.</text>
  <text class="body hide c4" x="450" y="430" text-anchor="middle">So there is no pair of systems that can disagree, and no glue code whose job was to stop them.</text>

  <text class="body" x="450" y="458" text-anchor="middle">What you give up is breadth: each of the three systems above does more than Felix's reading of it does.</text>
</svg>
