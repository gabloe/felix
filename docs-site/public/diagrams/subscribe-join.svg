<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-label="Two orderings for joining stored history to live delivery, on one timeline. In the obvious order the broker reads history from disk first and registers the live subscription afterwards, so a publish landing between the two steps has nobody listening and is lost. In the shipped order the live subscription is registered first, clamped to the oldest offset the replay ring holds, so the same publish is captured; only then is the older range read from disk, and that range is closed because nothing can grow it.">

  <style>
    .tag   { fill: var(--ink-dim); font: 600 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .09em; }
    .name  { fill: var(--ink); font: 600 13px ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .body  { fill: var(--ink-dim); font: 400 13px ui-sans-serif, system-ui, sans-serif; }
    .mono  { fill: var(--ink-dim); font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .small { fill: var(--ink-dim); font: 500 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bad   { fill: var(--danger); font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .good  { fill: var(--okay); font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .step  { stroke: var(--edge); stroke-width: 1.25; fill: var(--c-step); }
    .lane  { stroke: var(--edge-dim); stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .drop  { stroke: var(--accent); stroke-width: 1.75; fill: none; }
    .rule  { stroke: var(--edge-dim); stroke-width: 1; }

    :root {
      --ink:#1a2b40; --ink-dim:#5b6b7f; --edge:#4a6fa5; --edge-dim:#aab6c6;
      --accent:#b0653a; --c-step:#e8f0fe; --c-hot:#fbe9d6;
      --c-lost:#efdcdc; --c-kept:#d9ecd9; --danger:#a4453f; --okay:#3f7a52;
    }
    @media (prefers-color-scheme: dark) { :root {
      --ink:#dfe8f3; --ink-dim:#9aabbf; --edge:#6d94cc; --edge-dim:#46536a;
      --accent:#d99a6c; --c-step:#24344b; --c-hot:#40301c;
      --c-lost:#43262a; --c-kept:#1f3a28; --danger:#e08b84; --okay:#7fbf95; } }
    :root[data-theme="dark"] {
      --ink:#dfe8f3; --ink-dim:#9aabbf; --edge:#6d94cc; --edge-dim:#46536a;
      --accent:#d99a6c; --c-step:#24344b; --c-hot:#40301c;
      --c-lost:#43262a; --c-kept:#1f3a28; --danger:#e08b84; --okay:#7fbf95; }
    :root[data-theme="light"] {
      --ink:#1a2b40; --ink-dim:#5b6b7f; --edge:#4a6fa5; --edge-dim:#aab6c6;
      --accent:#b0653a; --c-step:#e8f0fe; --c-hot:#fbe9d6;
      --c-lost:#efdcdc; --c-kept:#d9ecd9; --danger:#a4453f; --okay:#3f7a52; }

    /* Both rows run one 16s timeline and receive the publish at the same
       instant. Only the order of their two steps differs. */
    .hide { opacity: 0; }

    /* Step 1 of each row runs first, step 2 after the publish has landed. */
    .p1 { animation: p1 16s infinite; }
    @keyframes p1 { 0%,7% { fill: var(--c-step) } 10%,20% { fill: var(--c-hot) } 24%,96% { fill: var(--c-step) } 97%,100% { fill: var(--c-step) } }
    .p2 { animation: p2 16s infinite; }
    @keyframes p2 { 0%,44% { fill: var(--c-step) } 47%,57% { fill: var(--c-hot) } 60%,96% { fill: var(--c-step) } 97%,100% { fill: var(--c-step) } }

    /* The publish falls in at the same moment in both rows. */
    .fall { animation: fall 16s infinite; }
    @keyframes fall { 0%,24% { opacity: 0; transform: translateY(-26px) } 28%,96% { opacity: 1; transform: translateY(0px) } 97%,100% { opacity: 0; transform: translateY(-26px) } }
    .arrow { animation: arrow 16s infinite; }
    @keyframes arrow { 0%,23% { opacity: 0 } 26%,40% { opacity: 1 } 43%,100% { opacity: 0 } }

    /* Same record, two fates. The chip falls *and* changes colour, so both
       belong to one keyframe set — two classes would leave only one running. */
    .chipA { animation: chipA 16s infinite; }
    @keyframes chipA {
      0%,24%   { opacity: 0; transform: translateY(-26px); fill: var(--c-step) }
      28%,32%  { opacity: 1; transform: translateY(0px);   fill: var(--c-step) }
      35%,96%  { opacity: 1; transform: translateY(0px);   fill: var(--c-lost) }
      97%,100% { opacity: 0; transform: translateY(-26px); fill: var(--c-step) }
    }
    .chipB { animation: chipB 16s infinite; }
    @keyframes chipB {
      0%,24%   { opacity: 0; transform: translateY(-26px); fill: var(--c-step) }
      28%,32%  { opacity: 1; transform: translateY(0px);   fill: var(--c-step) }
      35%,96%  { opacity: 1; transform: translateY(0px);   fill: var(--c-kept) }
      97%,100% { opacity: 0; transform: translateY(-26px); fill: var(--c-step) }
    }

    .verdictA { animation: verdictA 16s infinite; }
    @keyframes verdictA { 0%,35% { opacity: 0 } 38%,96% { opacity: 1 } 97%,100% { opacity: 0 } }
    .result { animation: result 16s infinite; }
    @keyframes result { 0%,60% { opacity: 0 } 63%,96% { opacity: 1 } 97%,100% { opacity: 0 } }

    .c1 { animation: c1 16s infinite; } @keyframes c1 { 0%,6% { opacity:0 } 9%,22% { opacity:1 } 23%,100% { opacity:0 } }
    .c2 { animation: c2 16s infinite; } @keyframes c2 { 0%,23% { opacity:0 } 26%,42% { opacity:1 } 43%,100% { opacity:0 } }
    .c3 { animation: c3 16s infinite; } @keyframes c3 { 0%,43% { opacity:0 } 46%,59% { opacity:1 } 60%,100% { opacity:0 } }
    .c4 { animation: c4 16s infinite; } @keyframes c4 { 0%,60% { opacity:0 } 63%,96% { opacity:1 } 97%,100% { opacity:0 } }

    @media (prefers-reduced-motion: reduce) {
      .p1,.p2,.fall,.arrow,.chipA,.chipB,.verdictA,.result,.c1,.c2,.c3,.c4 { animation: none; }
      .fall,.chipA,.chipB,.verdictA,.result { opacity: 1; transform: none; }
      .arrow { opacity: 0; }
      .chipA { fill: var(--c-lost); }
      .chipB { fill: var(--c-kept); }
      .c4 { opacity: 1; }
    }
  </style>

  <defs>
    <marker id="sd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text class="tag" x="450" y="24" text-anchor="middle">JOINING STORED HISTORY TO LIVE DELIVERY — THE ORDER IS THE DESIGN</text>

  <!-- the publish that decides it -->
  <g class="hide arrow">
    <path class="drop" d="M 400 44 L 400 66" marker-end="url(#sd)"/>
    <text class="mono" x="414" y="52" style="fill: var(--accent)">a publish lands: offset 16</text>
  </g>

  <!-- ================================= row A ================================= -->
  <text class="name" x="30" y="94">The obvious order</text>
  <text class="small" x="30" y="110">read, then register</text>

  <rect class="step p1" x="180" y="76" width="196" height="46" rx="5"/>
  <text class="small" x="278" y="96" text-anchor="middle">read history from disk</text>
  <text class="small" x="278" y="112" text-anchor="middle">offsets 3 … 15</text>

  <rect class="lane" x="384" y="76" width="72" height="46" rx="5"/>
  <rect class="step chipA" x="392" y="86" width="56" height="26" rx="4"/>
  <text class="small fall" x="420" y="103" text-anchor="middle">16</text>
  <text class="bad hide verdictA" x="420" y="140" text-anchor="middle">nobody is listening</text>

  <rect class="step p2" x="464" y="76" width="196" height="46" rx="5"/>
  <text class="small" x="562" y="96" text-anchor="middle">register the live</text>
  <text class="small" x="562" y="112" text-anchor="middle">subscription — from 17</text>

  <text class="bad hide result" x="562" y="158" text-anchor="middle">→ 16 never delivered</text>

  <line class="rule" x1="30" y1="176" x2="870" y2="176"/>

  <!-- ================================= row B ================================= -->
  <text class="name" x="30" y="234">The shipped order</text>
  <text class="small" x="30" y="250">register, then read</text>

  <rect class="step p1" x="180" y="216" width="196" height="46" rx="5"/>
  <text class="small" x="278" y="236" text-anchor="middle">register the live</text>
  <text class="small" x="278" y="252" text-anchor="middle">subscription, clamped to 16</text>

  <rect class="lane" x="384" y="216" width="72" height="46" rx="5"/>
  <rect class="step chipB" x="392" y="226" width="56" height="26" rx="4"/>
  <text class="small fall" x="420" y="243" text-anchor="middle">16</text>
  <text class="good hide verdictA" x="420" y="280" text-anchor="middle">held in the backlog</text>

  <rect class="step p2" x="464" y="216" width="196" height="46" rx="5"/>
  <text class="small" x="562" y="236" text-anchor="middle">read history from disk</text>
  <text class="small" x="562" y="252" text-anchor="middle">offsets 3 … 15</text>

  <text class="good hide result" x="562" y="298" text-anchor="middle">→ 3…15, 16, 17… with no gap</text>

  <!-- ================================ captions =============================== -->
  <text class="body hide c1" x="450" y="338" text-anchor="middle">Both orders do the same two things. Only one of them is safe.</text>
  <text class="body hide c2" x="450" y="338" text-anchor="middle">A publish arrives between the steps — the same publish, at the same instant, in both rows.</text>
  <text class="body hide c3" x="450" y="338" text-anchor="middle">Registering first pins the live edge, so the range left to read from disk is closed: nothing can grow it.</text>
  <text class="body hide c4" x="450" y="338" text-anchor="middle">Reading first leaves a window with no subscriber in it, and whatever lands there is never delivered.</text>

  <text class="body" x="450" y="386" text-anchor="middle">"Read the history, then start listening" is the intuitive order, and it is the bug. The subscription is registered</text>
  <text class="body" x="450" y="404" text-anchor="middle">first — clamped to the oldest offset the replay ring still holds — and only then is the older range read.</text>
  <text class="body" x="450" y="430" text-anchor="middle">History joins live delivery with no gap and no duplicate, which is what makes a resumed subscription trustworthy.</text>
</svg>
