<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="A plain-language walkthrough of how one log serves three jobs. Five records are written one after another, each landing at the end of the line and never changing afterwards: a equals 1, b equals 1, a equals 2, c equals 1, b equals 2. Three markers then read the same records in different ways. The stream marker walks forward across every record in turn and ends at the newest one. The queue marker follows the same path but falls behind, and the reason is shown beside it: a worker holds one record at a time and reports working on it, the marker stays put for as long as that lasts, and only when the worker reports done does the marker advance to the next record. At the end of the loop the worker is still busy, so the queue marker rests one record behind the stream. The cache is not one marker but three, one for each key: the marker for a jumps to the third record, the marker for b jumps to the last record, and the marker for c rests on the fourth, each pointing at the newest record carrying its own key. Nothing is copied anywhere; the three markers are simply three ways of pointing at the same five records.">

  <style>
    .tag   { fill: var(--ink-dim); font: 600 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .09em; }
    .name  { fill: var(--ink); font: 600 12px ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: .05em; }
    .body  { fill: var(--ink-dim); font: 400 13px ui-sans-serif, system-ui, sans-serif; }
    .small { fill: var(--ink-dim); font: 500 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .key   { fill: var(--ink); font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .rec   { stroke: var(--edge); stroke-width: 1.25; fill: var(--c-step); }
    .spine { stroke: var(--edge-dim); stroke-width: 1.25; }
    .rule  { stroke: var(--edge-dim); stroke-width: 1; }
    .worker { stroke: var(--edge-dim); stroke-width: 1.25; fill: none; }
    .mk    { fill: var(--edge); }
    .mkq   { fill: var(--okay); }
    .mkc   { fill: var(--accent); }

    :root {
      --ink:#1a2b40; --ink-dim:#5b6b7f; --edge:#4a6fa5; --edge-dim:#aab6c6;
      --accent:#b0653a; --okay:#3f7a52; --c-step:#e8f0fe;
    }
    @media (prefers-color-scheme: dark) { :root {
      --ink:#dfe8f3; --ink-dim:#9aabbf; --edge:#6d94cc; --edge-dim:#46536a;
      --accent:#d99a6c; --okay:#7fbf95; --c-step:#24344b; } }
    :root[data-theme="dark"] {
      --ink:#dfe8f3; --ink-dim:#9aabbf; --edge:#6d94cc; --edge-dim:#46536a;
      --accent:#d99a6c; --okay:#7fbf95; --c-step:#24344b; }
    :root[data-theme="light"] {
      --ink:#1a2b40; --ink-dim:#5b6b7f; --edge:#4a6fa5; --edge-dim:#aab6c6;
      --accent:#b0653a; --okay:#3f7a52; --c-step:#e8f0fe; }

    /* One 20s loop. Every marker moves on the same clock, because the point is
       that all three readings happen at once over the same records. */
    .hide { opacity: 0; }

    .w0 { animation: w0 20s infinite; } @keyframes w0 { 0%,3% { opacity:0 } 5%,96% { opacity:1 } 97%,100% { opacity:0 } }
    .w1 { animation: w1 20s infinite; } @keyframes w1 { 0%,8% { opacity:0 } 10%,96% { opacity:1 } 97%,100% { opacity:0 } }
    .w2 { animation: w2 20s infinite; } @keyframes w2 { 0%,13% { opacity:0 } 15%,96% { opacity:1 } 97%,100% { opacity:0 } }
    .w3 { animation: w3 20s infinite; } @keyframes w3 { 0%,18% { opacity:0 } 20%,96% { opacity:1 } 97%,100% { opacity:0 } }
    .w4 { animation: w4 20s infinite; } @keyframes w4 { 0%,23% { opacity:0 } 25%,96% { opacity:1 } 97%,100% { opacity:0 } }

    /* The stream: every record, in the order it was written. */
    .mstream { animation: mstream 20s infinite; }
    @keyframes mstream {
      0%,4%   { opacity: 0; transform: translateX(0px) }
      6%,9%   { opacity: 1; transform: translateX(0px) }
      11%,14% { opacity: 1; transform: translateX(96px) }
      16%,19% { opacity: 1; transform: translateX(192px) }
      21%,24% { opacity: 1; transform: translateX(288px) }
      26%,96% { opacity: 1; transform: translateX(384px) }
      97%,100% { opacity: 0; transform: translateX(0px) }
    }

    /* The queue: same records, but it only moves when work is finished, so it
       ends the loop behind the stream rather than beside it. Each advance below
       happens immediately after the worker reports done, and the last record is
       still being worked on when the loop ends — which is the whole reason the
       marker trails. */
    .mqueue { animation: mqueue 20s infinite; }
    @keyframes mqueue {
      0%,11%  { opacity: 0; transform: translateX(0px) }
      13%,22% { opacity: 1; transform: translateX(0px) }
      25%,36% { opacity: 1; transform: translateX(96px) }
      39%,52% { opacity: 1; transform: translateX(192px) }
      56%,96% { opacity: 1; transform: translateX(288px) }
      97%,100% { opacity: 0; transform: translateX(288px) }
    }

    /* The worker that causes those advances. Busy while it holds a record,
       then done — and only then does the marker move. */
    .wpill { animation: wpill 20s infinite; } @keyframes wpill { 0%,11% { opacity:0 } 13%,96% { opacity:1 } 97%,100% { opacity:0 } }
    .wbusy { animation: wbusy 20s infinite; }
    @keyframes wbusy {
      0%,13%  { opacity: 0 }
      15%,20% { opacity: 1 }
      21%,26% { opacity: 0 }
      28%,34% { opacity: 1 }
      35%,40% { opacity: 0 }
      42%,50% { opacity: 1 }
      51%,57% { opacity: 0 }
      59%,96% { opacity: 1 }
      97%,100% { opacity: 0 }
    }
    .wdone { animation: wdone 20s infinite; }
    @keyframes wdone {
      0%,20%  { opacity: 0 }
      22%,24% { opacity: 1 }
      25%,34% { opacity: 0 }
      36%,38% { opacity: 1 }
      39%,50% { opacity: 0 }
      52%,55% { opacity: 1 }
      56%,100% { opacity: 0 }
    }

    /* The cache: one marker per key, each on that key's newest record. */
    .mkeyA { animation: mkeyA 20s infinite; }
    @keyframes mkeyA {
      0%,4%   { opacity: 0; transform: translateX(0px) }
      6%,14%  { opacity: 1; transform: translateX(0px) }
      16%,96% { opacity: 1; transform: translateX(192px) }
      97%,100% { opacity: 0; transform: translateX(0px) }
    }
    .mkeyB { animation: mkeyB 20s infinite; }
    @keyframes mkeyB {
      0%,9%   { opacity: 0; transform: translateX(96px) }
      11%,24% { opacity: 1; transform: translateX(96px) }
      26%,96% { opacity: 1; transform: translateX(384px) }
      97%,100% { opacity: 0; transform: translateX(96px) }
    }
    .mkeyC { animation: mkeyC 20s infinite; }
    @keyframes mkeyC {
      0%,19%  { opacity: 0; transform: translateX(288px) }
      21%,96% { opacity: 1; transform: translateX(288px) }
      97%,100% { opacity: 0; transform: translateX(288px) }
    }

    .c1 { animation: c1 20s infinite; } @keyframes c1 { 0%,4% { opacity:0 } 7%,27% { opacity:1 } 28%,100% { opacity:0 } }
    .c2 { animation: c2 20s infinite; } @keyframes c2 { 0%,28% { opacity:0 } 31%,50% { opacity:1 } 51%,100% { opacity:0 } }
    .c3 { animation: c3 20s infinite; } @keyframes c3 { 0%,51% { opacity:0 } 54%,72% { opacity:1 } 73%,100% { opacity:0 } }
    .c4 { animation: c4 20s infinite; } @keyframes c4 { 0%,73% { opacity:0 } 76%,96% { opacity:1 } 97%,100% { opacity:0 } }

    @media (prefers-reduced-motion: reduce) {
      .w0,.w1,.w2,.w3,.w4,.mstream,.mqueue,.mkeyA,.mkeyB,.mkeyC,
      .wpill,.wbusy,.wdone,.c1,.c2,.c3,.c4 { animation: none; }
      .wpill,.wbusy { opacity: 1; }
      .w0,.w1,.w2,.w3,.w4 { opacity: 1; }
      .mstream { opacity: 1; transform: translateX(384px); }
      .mqueue  { opacity: 1; transform: translateX(288px); }
      .mkeyA   { opacity: 1; transform: translateX(192px); }
      .mkeyB   { opacity: 1; transform: translateX(384px); }
      .mkeyC   { opacity: 1; transform: translateX(288px); }
      .c4 { opacity: 1; }
    }
  </style>

  <text class="tag" x="450" y="28" text-anchor="middle">ONE LOG, THREE WAYS TO READ IT</text>

  <!-- ============================== the records ============================== -->
  <text class="small" x="205" y="62" text-anchor="end">writes only ever</text>
  <text class="small" x="205" y="76" text-anchor="end">land at the end</text>
  <line class="spine" x1="207" y1="102" x2="700" y2="102"/>

  <rect class="rec hide w0" x="215" y="82" width="86" height="42" rx="4"/>
  <rect class="rec hide w1" x="311" y="82" width="86" height="42" rx="4"/>
  <rect class="rec hide w2" x="407" y="82" width="86" height="42" rx="4"/>
  <rect class="rec hide w3" x="503" y="82" width="86" height="42" rx="4"/>
  <rect class="rec hide w4" x="599" y="82" width="86" height="42" rx="4"/>

  <g class="hide w0"><text class="key" x="258" y="108" text-anchor="middle">a=1</text><text class="small" x="258" y="142" text-anchor="middle">1st</text></g>
  <g class="hide w1"><text class="key" x="354" y="108" text-anchor="middle">b=1</text><text class="small" x="354" y="142" text-anchor="middle">2nd</text></g>
  <g class="hide w2"><text class="key" x="450" y="108" text-anchor="middle">a=2</text><text class="small" x="450" y="142" text-anchor="middle">3rd</text></g>
  <g class="hide w3"><text class="key" x="546" y="108" text-anchor="middle">c=1</text><text class="small" x="546" y="142" text-anchor="middle">4th</text></g>
  <g class="hide w4"><text class="key" x="642" y="108" text-anchor="middle">b=2</text><text class="small" x="642" y="142" text-anchor="middle">5th</text></g>

  <line class="rule" x1="30" y1="164" x2="870" y2="164"/>

  <!-- =============================== the stream ============================== -->
  <text class="name" x="30" y="200">STREAM</text>
  <text class="small" x="30" y="216">every record</text>
  <g class="hide mstream">
    <path class="mk" d="M 258 186 l -8 14 l 16 0 z"/>
    <text class="small" x="258" y="218" text-anchor="middle" style="fill: var(--edge)">reading</text>
  </g>

  <!-- =============================== the queue =============================== -->
  <text class="name" x="30" y="264">QUEUE</text>
  <text class="small" x="30" y="280">finished work</text>
  <g class="hide mqueue">
    <path class="mkq" d="M 258 250 l -8 14 l 16 0 z"/>
    <text class="small" x="258" y="282" text-anchor="middle" style="fill: var(--okay)">held</text>
  </g>

  <!-- The worker whose answer moves that marker. -->
  <g class="hide wpill">
    <line class="spine" x1="666" y1="264" x2="700" y2="264"/>
    <rect class="worker" x="700" y="238" width="176" height="52" rx="6"/>
    <text class="small" x="712" y="256">one worker</text>
  </g>
  <text class="small hide wbusy" x="712" y="276" style="fill: var(--ink-dim)">working on it…</text>
  <text class="small hide wdone" x="712" y="276" style="fill: var(--okay)">done, marker moves</text>

  <!-- =============================== the cache =============================== -->
  <text class="name" x="30" y="328">CACHE</text>
  <text class="small" x="30" y="344">one per key</text>
  <g class="hide mkeyA">
    <path class="mkc" d="M 258 314 l -8 14 l 16 0 z"/>
    <text class="small" x="258" y="346" text-anchor="middle" style="fill: var(--accent)">a</text>
  </g>
  <g class="hide mkeyB">
    <path class="mkc" d="M 258 314 l -8 14 l 16 0 z"/>
    <text class="small" x="258" y="346" text-anchor="middle" style="fill: var(--accent)">b</text>
  </g>
  <g class="hide mkeyC">
    <path class="mkc" d="M 258 314 l -8 14 l 16 0 z"/>
    <text class="small" x="258" y="346" text-anchor="middle" style="fill: var(--accent)">c</text>
  </g>

  <!-- ================================ captions =============================== -->
  <text class="body hide c1" x="450" y="386" text-anchor="middle">Every write lands at the end of the line. Nothing already written is ever changed.</text>
  <text class="body hide c2" x="450" y="386" text-anchor="middle">A stream is a marker walking forward over every record, in the order they were written.</text>
  <text class="body hide c3" x="450" y="386" text-anchor="middle">A queue hands a record to one worker. The marker moves only when that worker says it is finished.</text>
  <text class="body hide c4" x="450" y="386" text-anchor="middle">A cache is one marker per key, each sitting on the newest record for its own key.</text>

  <text class="body" x="450" y="416" text-anchor="middle">Same records. Three ways of pointing at them. Nothing is copied into a second system.</text>
</svg>
