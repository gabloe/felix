<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="An animated walkthrough of a keyed cache watch. Writes for several keys are applied to one cache shard's log in order, each taking the next offset. A watch on the prefix user: receives a copy of each matching change the moment it is applied — puts with their values, a delete as a tombstone — while writes to other keys pass it by. The delivered copies keep their log offsets, so the watch's offsets are sparse by construction: 0, 2, 3, 5, 7. That is why a gap between delivered offsets is not a drop signal for a watch, and why falling behind is reported with an explicit lagged message instead.">

  <style>
    .tag   { fill: var(--ink-dim); font: 600 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .09em; }
    .name  { fill: var(--ink); font: 600 13px ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .body  { fill: var(--ink-dim); font: 400 13px ui-sans-serif, system-ui, sans-serif; }
    .mono  { fill: var(--ink); font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .small { fill: var(--ink-dim); font: 500 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .good  { fill: var(--okay); font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .lane  { stroke: var(--edge-dim); stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .rule  { stroke: var(--edge-dim); stroke-width: 1; }

    :root {
      --ink:#1a2b40; --ink-dim:#5b6b7f; --edge:#4a6fa5; --edge-dim:#aab6c6;
      --accent:#b0653a; --c-step:#e8f0fe; --c-hot:#fbe9d6;
      --c-other:#eef1f5; --c-kept:#d9ecd9; --danger:#a4453f; --okay:#3f7a52;
    }
    @media (prefers-color-scheme: dark) { :root {
      --ink:#dfe8f3; --ink-dim:#9aabbf; --edge:#6d94cc; --edge-dim:#46536a;
      --accent:#d99a6c; --c-step:#24344b; --c-hot:#40301c;
      --c-other:#222b38; --c-kept:#1f3a28; --danger:#e08b84; --okay:#7fbf95; } }
    :root[data-theme="dark"] {
      --ink:#dfe8f3; --ink-dim:#9aabbf; --edge:#6d94cc; --edge-dim:#46536a;
      --accent:#d99a6c; --c-step:#24344b; --c-hot:#40301c;
      --c-other:#222b38; --c-kept:#1f3a28; --danger:#e08b84; --okay:#7fbf95; }
    :root[data-theme="light"] {
      --ink:#1a2b40; --ink-dim:#5b6b7f; --edge:#4a6fa5; --edge-dim:#aab6c6;
      --accent:#b0653a; --c-step:#e8f0fe; --c-hot:#fbe9d6;
      --c-other:#eef1f5; --c-kept:#d9ecd9; --danger:#a4453f; --okay:#3f7a52; }

    /* One 16s loop. Each write flashes hot in log order; a matching write's
       copy then falls into the watch lane and stays for the rest of the loop.
       Chip i flashes at 4+7i percent; its copy lands two ticks later. */
    .chip  { stroke: var(--edge); stroke-width: 1.25; fill: var(--c-step); }
    .other { stroke: var(--edge-dim); stroke-width: 1.25; fill: var(--c-other); }

    .w0 { animation: w0 16s infinite; } @keyframes w0 { 0%,3% { fill: var(--c-step) } 5%,9% { fill: var(--c-hot) } 12%,100% { fill: var(--c-step) } }
    .w1 { animation: w1 16s infinite; } @keyframes w1 { 0%,10% { fill: var(--c-other) } 12%,16% { fill: var(--c-hot) } 19%,100% { fill: var(--c-other) } }
    .w2 { animation: w2 16s infinite; } @keyframes w2 { 0%,17% { fill: var(--c-step) } 19%,23% { fill: var(--c-hot) } 26%,100% { fill: var(--c-step) } }
    .w3 { animation: w3 16s infinite; } @keyframes w3 { 0%,24% { fill: var(--c-step) } 26%,30% { fill: var(--c-hot) } 33%,100% { fill: var(--c-step) } }
    .w4 { animation: w4 16s infinite; } @keyframes w4 { 0%,31% { fill: var(--c-other) } 33%,37% { fill: var(--c-hot) } 40%,100% { fill: var(--c-other) } }
    .w5 { animation: w5 16s infinite; } @keyframes w5 { 0%,38% { fill: var(--c-step) } 40%,44% { fill: var(--c-hot) } 47%,100% { fill: var(--c-step) } }
    .w6 { animation: w6 16s infinite; } @keyframes w6 { 0%,45% { fill: var(--c-other) } 47%,51% { fill: var(--c-hot) } 54%,100% { fill: var(--c-other) } }
    .w7 { animation: w7 16s infinite; } @keyframes w7 { 0%,52% { fill: var(--c-step) } 54%,58% { fill: var(--c-hot) } 61%,100% { fill: var(--c-step) } }

    /* Delivered copies: fall from the log lane into the watch lane and stay. */
    .f0 { animation: f0 16s infinite; } @keyframes f0 { 0%,7%  { opacity: 0; transform: translateY(-120px) } 12%,96% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0; transform: translateY(-120px) } }
    .f2 { animation: f2 16s infinite; } @keyframes f2 { 0%,21% { opacity: 0; transform: translateY(-120px) } 26%,96% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0; transform: translateY(-120px) } }
    .f3 { animation: f3 16s infinite; } @keyframes f3 { 0%,28% { opacity: 0; transform: translateY(-120px) } 33%,96% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0; transform: translateY(-120px) } }
    .f5 { animation: f5 16s infinite; } @keyframes f5 { 0%,42% { opacity: 0; transform: translateY(-120px) } 47%,96% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0; transform: translateY(-120px) } }
    .f7 { animation: f7 16s infinite; } @keyframes f7 { 0%,56% { opacity: 0; transform: translateY(-120px) } 61%,96% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0; transform: translateY(-120px) } }

    /* Writes to other keys slide past the watch lane and fade out. */
    .s1 { animation: s1 16s infinite; } @keyframes s1 { 0%,13% { opacity: 0; transform: translateY(0) } 16% { opacity: .6; transform: translateY(38px) } 22%,100% { opacity: 0; transform: translateY(66px) } }
    .s4 { animation: s4 16s infinite; } @keyframes s4 { 0%,34% { opacity: 0; transform: translateY(0) } 37% { opacity: .6; transform: translateY(38px) } 43%,100% { opacity: 0; transform: translateY(66px) } }
    .s6 { animation: s6 16s infinite; } @keyframes s6 { 0%,48% { opacity: 0; transform: translateY(0) } 51% { opacity: .6; transform: translateY(38px) } 57%,100% { opacity: 0; transform: translateY(66px) } }

    /* The closing note appears once the last delivery has landed. */
    .note { animation: note 16s infinite; }
    @keyframes note { 0%,62% { opacity: 0 } 66%,96% { opacity: 1 } 97%,100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .w0,.w1,.w2,.w3,.w4,.w5,.w6,.w7 { animation: none; }
      .f0,.f2,.f3,.f5,.f7 { animation: none; opacity: 1; transform: none; }
      .s1,.s4,.s6 { animation: none; opacity: 0; }
      .note { animation: none; opacity: 1; }
    }
  </style>

  <!-- Log lane -->
  <text class="tag" x="24" y="34">CACHE SHARD LOG — WRITES IN ORDER, EACH AT THE NEXT OFFSET</text>
  <rect class="lane" x="16" y="46" width="868" height="92" rx="10"/>

  <!-- Log chips: offset · key (value) -->
  <g>
    <rect class="chip w0" x="34"  y="66" width="96" height="52" rx="8"/>
    <text class="small" x="42" y="84">offset 0</text>
    <text class="mono"  x="42" y="104">user:1 = a</text>

    <rect class="other w1" x="140" y="66" width="96" height="52" rx="8"/>
    <text class="small" x="148" y="84">offset 1</text>
    <text class="mono"  x="148" y="104">order:9</text>

    <rect class="chip w2" x="246" y="66" width="96" height="52" rx="8"/>
    <text class="small" x="254" y="84">offset 2</text>
    <text class="mono"  x="254" y="104">user:2 = b</text>

    <rect class="chip w3" x="352" y="66" width="96" height="52" rx="8"/>
    <text class="small" x="360" y="84">offset 3</text>
    <text class="mono"  x="360" y="104">user:1 = c</text>

    <rect class="other w4" x="458" y="66" width="96" height="52" rx="8"/>
    <text class="small" x="466" y="84">offset 4</text>
    <text class="mono"  x="466" y="104">order:9</text>

    <rect class="chip w5" x="564" y="66" width="96" height="52" rx="8"/>
    <text class="small" x="572" y="84">offset 5</text>
    <text class="mono"  x="572" y="104">user:1 = ∅</text>

    <rect class="other w6" x="670" y="66" width="96" height="52" rx="8"/>
    <text class="small" x="678" y="84">offset 6</text>
    <text class="mono"  x="678" y="104">order:2</text>

    <rect class="chip w7" x="776" y="66" width="96" height="52" rx="8"/>
    <text class="small" x="784" y="84">offset 7</text>
    <text class="mono"  x="784" y="104">user:3 = d</text>
  </g>

  <!-- Non-matching writes slide past the watch, undelivered. -->
  <g class="s1">
    <rect class="other" x="140" y="142" width="96" height="30" rx="8"/>
    <text class="small" x="152" y="161">filtered out</text>
  </g>
  <g class="s4">
    <rect class="other" x="458" y="142" width="96" height="30" rx="8"/>
    <text class="small" x="470" y="161">filtered out</text>
  </g>
  <g class="s6">
    <rect class="other" x="670" y="142" width="96" height="30" rx="8"/>
    <text class="small" x="682" y="161">filtered out</text>
  </g>

  <!-- Watch lane -->
  <text class="tag" x="24" y="222">WATCH prefix "user:" — DELIVERED IN WRITE ORDER, OFFSETS KEPT</text>
  <rect class="lane" x="16" y="234" width="868" height="92" rx="10"/>

  <!-- Delivered copies land directly below their log chip: the empty slots
       between them ARE the filtered-out writes. -->
  <g class="f0">
    <rect class="chip" x="34" y="254" width="96" height="52" rx="8"/>
    <text class="small" x="42" y="272">offset 0</text>
    <text class="mono"  x="42" y="292">user:1 = a</text>
  </g>
  <g class="f2">
    <rect class="chip" x="246" y="254" width="96" height="52" rx="8"/>
    <text class="small" x="254" y="272">offset 2</text>
    <text class="mono"  x="254" y="292">user:2 = b</text>
  </g>
  <g class="f3">
    <rect class="chip" x="352" y="254" width="96" height="52" rx="8"/>
    <text class="small" x="360" y="272">offset 3</text>
    <text class="mono"  x="360" y="292">user:1 = c</text>
  </g>
  <g class="f5">
    <rect class="chip" x="564" y="254" width="96" height="52" rx="8"/>
    <text class="small" x="572" y="272">offset 5</text>
    <text class="mono"  x="572" y="292">delete ∅</text>
  </g>
  <g class="f7">
    <rect class="chip" x="776" y="254" width="96" height="52" rx="8"/>
    <text class="small" x="784" y="272">offset 7</text>
    <text class="mono"  x="784" y="292">user:3 = d</text>
  </g>

  <!-- Closing note -->
  <g class="note">
    <line class="rule" x1="16" y1="352" x2="884" y2="352"/>
    <text class="good" x="24" y="380">delivered offsets: 0, 2, 3, 5, 7 — sparse by construction</text>
    <text class="body" x="24" y="404">A gap between delivered offsets is other keys' traffic, not loss. A watch that actually falls behind is</text>
    <text class="body" x="24" y="422">ended with an explicit lagged signal naming the first missed offset; re-watching from it is gapless.</text>
  </g>
</svg>
