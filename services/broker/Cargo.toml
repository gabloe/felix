[package]
name = "broker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Felix broker service binary"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# Not a library anyone consumes from a registry: service binaries and a
# dev/CI tool with hard Elastic-2.0 dependencies.
publish = false

[[bin]]
name = "felix-broker"
path = "src/main.rs"

[[bin]]
name = "pubsub-demo-simple"
path = "../../demos/broker/simple_pubsub_demo.rs"

[[bin]]
name = "cache-demo"
path = "../../demos/broker/cache_demo.rs"

[[bin]]
name = "latency-demo"
path = "../../demos/broker/latency_demo.rs"

[[bin]]
name = "pubsub-demo-notifications"
path = "../../demos/broker/notifications_demo.rs"

[[bin]]
name = "pubsub-demo-orders"
path = "../../demos/broker/orders_demo.rs"

[[bin]]
name = "durable-restart-demo"
path = "../../demos/broker/durable_restart_demo.rs"

# Soak and resource-leak harness (#154). Not a demo: it exits non-zero on a
# finding so CI can gate on it.
[[bin]]
name = "soak"
path = "src/bin/soak/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
felix-broker = { path = "../../crates/felix-broker", version = "0.1.1" }
felix-common = { path = "../../crates/felix-common", version = "0.1.1", features = ["lifecycle"] }
felix-client = { path = "../../crates/felix-client", version = "0.1.1" }
felix-authz = { path = "../../crates/felix-authz", version = "0.1.1" }
felix-transport = { path = "../../crates/felix-transport", version = "0.1.1" }
felix-wire = { path = "../../crates/felix-wire", version = "0.1.1" }
felix-storage = { path = "../../crates/felix-storage", version = "0.1.1" }
bytes = { workspace = true }
dashmap = "6"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
futures = "0.3"
axum = "0.8"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
quinn = "0.11"
rcgen = "0.14"
rustls = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true }
# `TaskTracker` and `CancellationToken` back the graceful drain in `shutdown.rs`.
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = "0.32.1"

# Linux-only core pinning (`core_shards`) and Unix-wide SIGTERM delivery in the
# soak harness both need libc; the pinning call site stays `target_os = "linux"`
# gated in code.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Used by the durable-restart demo binary to stage a throwaway storage root.
tempfile = "3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
rcgen = "0.14"
rustls = "0.23"

[features]
default = []
telemetry = ["felix-client/telemetry", "felix-broker/telemetry"]
perf_debug = ["felix-broker/perf_debug"]

[lints.rust]
