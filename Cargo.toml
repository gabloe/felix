[workspace]
resolver = "2"
members = [
  "crates/felix-common",
  "crates/felix-wire",
  "crates/felix-transport",
  "crates/felix-storage",
  "crates/felix-broker",
  "crates/felix-metadata",
  "crates/felix-consensus",
  "crates/felix-router",
  "crates/felix-crypto",
  "crates/felix-authz",
  "crates/felix-client",
  "crates/felix-conformance",
  "services/controlplane",
  "services/agent",
  "services/broker",
]

[profile.dev]
# Debug builds dominate disk here: a single clean `cargo test --workspace --no-run`
# produced 6.1 GB, and the accumulated target directory reached 41 GB because cargo
# keys artifacts by feature set and never garbage-collects the old ones.
#
# On macOS `split-debuginfo` defaults to `unpacked`, so DWARF stays in the per-CGU
# object files rather than being folded into the binary — 17.6 GB of `.o` files at
# the peak, against only 4.2 GB of actual executables. `line-tables-only` keeps what
# panics and backtraces need (file, line, symbol) and drops the rest: variable
# layouts, types, lexical scopes. Step-debugging locals in a debugger is what this
# gives up; if you need that, raise it back to `debug = true` for the session.
debug = "line-tables-only"

# Third-party code is the bulk of those object files and is almost never stepped
# through. Symbols still appear in backtraces; only line numbers inside
# dependencies are lost. Workspace crates keep their line tables from the setting
# above, because those are the frames that matter when a test fails.
[profile.dev.package."*"]
debug = false

[profile.release]
# The hot path spans crate boundaries — felix-wire encode/decode, felix-broker
# fanout, and the broker service's QUIC handlers are separate crates — so
# cross-crate inlining is where the wins are. `codegen-units = 1` costs build
# time but is what lets LTO see the whole picture.
#
# Deliberately NOT `panic = "abort"`. Tokio contains a panicking task by
# unwinding it; aborting would turn any single request-triggered panic into a
# whole-broker outage, which is the opposite of what docs/security/panic-audit.md
# concluded the panic surface should do.
lto = "fat"
codegen-units = 1

[workspace.package]
edition = "2024"
# Single source of truth for member crate versions. Members opt in with
# `version.workspace = true`; bumping a release means editing this line only.
# Non-member demos under demos/ keep their own literal version.
version = "0.1.1"
# Fail-closed default: a new crate inherits the *restrictive* licence unless it
# deliberately opts into Apache-2.0. The permissive crates (felix-wire,
# felix-common, felix-transport, felix-client, felix-conformance) set
# `license = "Apache-2.0"` explicitly. See LICENSING.md for the authoritative
# table; `task publish:check` fails CI if a crate drifts from it.
license = "Elastic-2.0"
rust-version = "1.97"
repository = "https://github.com/gabloe/felix"
homepage = "https://github.com/gabloe/felix"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
