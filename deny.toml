[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
  "Apache-2.0",
  # First-party server crates/services are Elastic-2.0 (source-available) as of the
  # BUSL/ELv2-vs-Apache split; see LICENSING.md. Not OSI-approved, allowed here
  # deliberately for our own workspace members, not because we'd accept it from a
  # third-party dependency without the same deliberate review.
  "Elastic-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # NOTE: We require RSA via jsonwebtoken for OIDC RS256 validation.
  # Remove only if OIDC validation migrates to non-RSA algorithms.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
