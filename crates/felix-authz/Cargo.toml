[package]
name = "felix-authz"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tenant-scoped token issuance and authorization for Felix"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["felix", "authorization", "jwt"]
categories = ["network-programming", "authentication"]

[dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
base64 = "0.23"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
casbin = { version = "2.20.0", default-features = false, features = ["runtime-tokio", "logging", "incremental"] }
tokio = { version = "1.50.0", features = ["fs", "io-util"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt"] }
