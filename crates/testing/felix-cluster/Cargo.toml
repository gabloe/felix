[package]
name = "felix-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local multi-node Felix cluster harness for integration and failure testing"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# A test and development harness, not a library anyone consumes from a registry.
publish = false

[[bin]]
name = "felix-cluster"
path = "src/bin/felix-cluster/main.rs"

[dependencies]
anyhow = { workspace = true }
# Peer certificates for the brokers this harness spawns: every cluster test
# runs under broker-to-broker mTLS.
rcgen = { workspace = true, features = ["x509-parser"] }
felix-controlplane-service = { path = "../../../services/felix-controlplane-service", version = "0.6.0-preview" }
felix-client = { path = "../../sdk/felix-client", version = "0.6.0-preview" }
felix-wire = { path = "../../protocol/felix-wire", version = "0.6.0-preview" }
bytes = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
felix-conformance = { version = "0.6.0-preview", path = "../felix-conformance" }

[target.'cfg(unix)'.dependencies]
# Suspending a broker needs a signal, not a kill: the point of the fault is a
# process that is still alive and holding its lease while answering nothing.
libc = { workspace = true }

[dev-dependencies]
# These spawn several broker processes each. Run one cluster at a time: a CI
# runner with two cores starting nine brokers at once starves them all, and the
# ephemeral ports they were handed are more likely to collide.
serial_test = { workspace = true }
# The Kafka tests run kcat in a container and need to bound how long it runs.
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
