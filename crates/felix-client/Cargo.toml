[package]
name = "felix-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
ahash = "0.8"
hashbrown = { version = "0.16", features = ["equivalent"] }
tokio = { workspace = true }
tracing = { workspace = true }
metrics = "0.24"
serde = { workspace = true, features = ["derive"] }
serde_yaml_ng = { workspace = true }
# felix-broker/felix-storage are optional: they're only needed by the `in-process` feature
# (an embedded-broker convenience mode for local dev/tests). Both are Elastic-2.0 licensed,
# unlike the rest of this crate's dependency graph (Apache-2.0) — keeping them optional and
# off by default means the default felix-client build has zero Elastic-2.0 transitive
# dependencies. See LICENSING.md at the repo root.
felix-broker = { path = "../felix-broker", version = "0.1.0", optional = true }
felix-storage = { path = "../felix-storage", version = "0.1.0", optional = true }
felix-transport = { path = "../felix-transport", version = "0.1.0" }
felix-wire = { path = "../felix-wire", version = "0.1.0" }
quinn = "0.11"

[features]
default = []
telemetry = []
# Embedded-broker convenience mode for local dev/tests, without a real QUIC connection.
# Off by default — see the dependency comment above.
in-process = ["dep:felix-broker", "dep:felix-storage"]

[dev-dependencies]
rcgen = "0.14"
rustls = "0.23"
serial_test = "3"
tempfile = "3"
tracing-subscriber = { workspace = true }
