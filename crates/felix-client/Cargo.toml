[package]
name = "felix-client"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Rust client SDK for the Felix pub/sub and cache broker"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["felix", "client", "pubsub", "messaging", "quic"]
categories = ["network-programming", "api-bindings"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
ahash = "0.8"
hashbrown = { version = "0.16", features = ["equivalent"] }
tokio = { workspace = true }
tracing = { workspace = true }
metrics = "0.24"
serde = { workspace = true, features = ["derive"] }
serde_yaml_ng = { workspace = true }
# felix-broker/felix-storage are optional: they're only needed by the `in-process` feature
# (an embedded-broker convenience mode for local dev/tests). Both are Elastic-2.0 licensed,
# unlike the rest of this crate's dependency graph (Apache-2.0) — keeping them optional and
# off by default means the default felix-client build has zero Elastic-2.0 transitive
# dependencies. See LICENSING.md at the repo root.
felix-broker = { path = "../felix-broker", version = "0.1.1", optional = true }
felix-storage = { path = "../felix-storage", version = "0.1.1", optional = true }
felix-transport = { path = "../felix-transport", version = "0.1.1" }
felix-wire = { path = "../felix-wire", version = "0.1.1" }
quinn = "0.11"

[features]
default = []
telemetry = []
# Embedded-broker convenience mode for local dev/tests, without a real QUIC connection.
# Off by default — see the dependency comment above.
in-process = ["dep:felix-broker", "dep:felix-storage"]

[dev-dependencies]
rcgen = "0.14"
rustls = "0.23"
serial_test = "3"
tempfile = "3"
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
# `in-process` and `telemetry` are off by default; document them anyway.
all-features = true
