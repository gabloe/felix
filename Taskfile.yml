version: "3"

tasks:
  fmt:
    cmds: ["cargo fmt --all"]
  lint:
    cmds:
      - "cargo fmt -- --check"
      - "cargo clippy --workspace --all-targets --all-features -- -D warnings"
  clippy:
    cmds: ["cargo clippy --workspace --all-targets --all-features -- -D warnings"]
  test:
    cmds:
      # felix-cluster's loadgen integration test shells out to a prebuilt
      # `target/debug/felix-loadgen`. `cargo test` only builds a bin's runnable
      # executable when that bin's own package has integration tests, and
      # felix-loadgen's only consumer is a test in *another* crate — so the
      # workspace test run never produces it, and those cases fail "not found".
      # Build it up front (the felix-broker bin needs no such help: services/broker
      # has its own integration tests, so cargo builds it).
      - "cargo build -p felix-loadgen"
      - "cargo test --workspace"
      # Run separately (not --all-features on the whole workspace): felix-client's
      # `in-process` feature only affects felix-client itself, and keeping it out of
      # the main workspace run avoids adding unrelated concurrent test load that can
      # perturb timing-sensitive tests elsewhere in the suite.
      - "cargo test -p felix-client --features in-process"
  pg:up:
    cmds:
      - |
        if docker version >/dev/null 2>&1; then
          docker inspect felix-pg-tests >/dev/null 2>&1 || docker run -d --rm \
            --name felix-pg-tests -e POSTGRES_PASSWORD=postgres -p 55432:5432 \
            postgres:16-alpine
        else
          echo "task: [pg:up] skipping postgres container (docker unavailable)"
        fi
  pg:down:
    cmds: ["docker rm -f felix-pg-tests >/dev/null 2>&1 || true"]
  coverage:
    cmds:
      # Same reason as `test`: felix-cluster's loadgen integration test shells
      # out to a prebuilt felix-loadgen, which the coverage run (like a plain
      # `cargo test`) does not build on its own. cargo llvm-cov uses
      # target/llvm-cov-target, not target/debug, so build the binary straight
      # into that dir — the exact path the test resolves relative to itself.
      - "cargo build -p felix-loadgen --target-dir target/llvm-cov-target"
      - |
        if [ -z "${CI:-}" ]; then
          task pg:down
          task pg:up
        else
          echo "task: [coverage] skipping pg:down/pg:up (CI detected)"
        fi
      - |
        if [ -n "${FELIX_TEST_DATABASE_URL:-}" ]; then
          FELIX_TEST_DATABASE_URL="$FELIX_TEST_DATABASE_URL" cargo llvm-cov --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '(^|/)(demos)(/|$)|(^|/)src/bin/' --lcov --output-path lcov.info
        elif docker version >/dev/null 2>&1; then
          FELIX_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:55432/postgres" cargo llvm-cov --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '(^|/)(demos)(/|$)|(^|/)src/bin/' --lcov --output-path lcov.info
        else
          cargo llvm-cov --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '(^|/)(demos)(/|$)|(^|/)src/bin/' --lcov --output-path lcov.info
        fi
      - "cargo llvm-cov report --summary-only --ignore-filename-regex '(^|/)(demos)(/|$)|(^|/)src/bin/'"
      - |
        if [ -z "${CI:-}" ]; then
          task pg:down
        else
          echo "task: [coverage] skipping pg:down (CI detected)"
        fi
  coverage:demos:
    cmds:
      - |
        if [ -z "${CI:-}" ]; then
          task pg:down
          task pg:up
        else
          echo "task: [coverage:demos] skipping pg:down/pg:up (CI detected)"
        fi
      - |
        if [ -n "${FELIX_TEST_DATABASE_URL:-}" ]; then
          FELIX_TEST_DATABASE_URL="$FELIX_TEST_DATABASE_URL" cargo llvm-cov --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '^(?!.*?/demos/)' --lcov --output-path lcov-demos.info
        elif docker version >/dev/null 2>&1; then
          FELIX_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:55432/postgres" cargo llvm-cov --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '^(?!.*?/demos/)' --lcov --output-path lcov-demos.info
        else
          cargo llvm-cov --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '^(?!.*?/demos/)' --lcov --output-path lcov-demos.info
        fi
      - "cargo llvm-cov report --summary-only"
      - |
        if [ -z "${CI:-}" ]; then
          task pg:down
        else
          echo "task: [coverage:demos] skipping pg:down (CI detected)"
        fi
  build:
    cmds: ["cargo build --workspace --release"]
  clean:
    cmds:
      - "cargo clean"
      - "rm -rf data/raw/stdout data/raw/latency_demo_runs.jsonl"
  clean-all:
    desc: "Remove all build artifacts, including any stale per-demo target dirs"
    cmds:
      - "rm -rf target"
      # Pre-dating the shared target-dir in .cargo/config.toml, each standalone
      # demo crate built its own ~3 GB target/. Remove any left behind.
      - "rm -rf demos/*/target"
  clean:stale:
    desc: "Prune build artifacts cargo will never collect, keeping the current build"
    # Cargo keys artifacts by package + features + flags and never garbage-collects
    # the losers, so every distinct build multiplies the directory: default vs
    # --all-features vs --features in-process, the four standalone demo crates that
    # resolve features independently, plus release. Measured at 41 GB against a
    # 4.2 GB single clean build — roughly sevenfold duplication, none of it reachable.
    #
    # Unlike `clean-all` this keeps what you are currently working with, so the next
    # build is incremental rather than from scratch.
    cmds:
      - "cargo install cargo-sweep --version 0.8.0 --locked"
      # Artifacts built by toolchains rustup no longer has are dead weight.
      - "cargo sweep --installed"
      # Then anything untouched for a week: old feature combinations, abandoned
      # branches' dependency graphs, superseded incremental caches.
      - "cargo sweep --time 7"
  deny:
    cmds:
      - "cargo install cargo-deny --version 0.19.0 --locked"
      - "cargo-deny check"
  publish:check:
    desc: "Assert the LICENSING.md licence split and crates.io publish-readiness"
    cmds:
      - "python3 scripts/check_publish_metadata.py"
  docs:evidence:
    desc: "Assert the docs' claims and reference tables still match the code"
    # Python and git only, no Node and no node_modules, because this has to run
    # in the Rust CI job: a citation goes stale when someone renames a *test*,
    # which is a Rust change. The mermaid and diagram checks need docs-site's
    # dependencies and stay in its build, where a diagram change is made.
    cmds:
      - "python3 scripts/check_doc_evidence.py"
      - "python3 scripts/check_env_reference.py"
      # Belongs here for the same reason: a feature bit or a message variant is
      # added in Rust, and that is the moment the docs fall behind.
      - "python3 scripts/check_capability_docs.py"
      # A milestone label in a published page is wrong the day it is written —
      # it names a project-board row the reader has never seen — so unlike the
      # status-claim report this one can fail.
      - "python3 scripts/check_public_docs_refs.py"
  docs:status:
    desc: "List the docs' claims that something is not built — read these when closing a milestone"
    # Not in docs:evidence, because it cannot fail on its own: a claim that
    # something is unbuilt is correct until the day it ships, and no check can
    # see that day from the prose alone. It is a report to read at the moment
    # those claims go stale, which is a milestone closing. Metadata Raft shipped
    # and five pages went on saying it "is not started"; this is what finds that.
    cmds:
      - "python3 scripts/check_status_claims.py --report"
      # Automatic where it can be: a claim citing an issue that is now closed is
      # drift with no judgement required. Skips without `gh`.
      - "python3 scripts/check_status_claims.py --check-issues"
  deny:rsa:default:
    cmds:
      - |
        for pkg in broker felix-authz felix-client felix-broker felix-transport felix-wire; do
          set +e
          tree=$(cargo tree -i rsa -p "$pkg" 2>/dev/null)
          status=$?
          set -e
          if [ $status -eq 0 ] && echo "$tree" | rg -q "rsa v"; then
            echo "$tree"
            echo "rsa crate detected in $pkg dependency tree"
            exit 1
          fi
        done
  demo:cache:
    cmds: ["cargo run --release -p broker --bin cache-demo -- {{.CLI_ARGS}}"]
  demo:latency:
    cmds: ["cargo run --release -p broker --bin latency-demo --all-features -- {{.CLI_ARGS}}"]
  demo:notifications:
    cmds: ["cargo run --release -p broker --bin pubsub-demo-notifications -- {{.CLI_ARGS}}"]
  demo:orders:
    cmds: ["cargo run --release -p broker --bin pubsub-demo-orders -- {{.CLI_ARGS}}"]
  demo:pubsub:
    cmds: ["cargo run --release -p broker --bin pubsub-demo-simple -- {{.CLI_ARGS}}"]
  demo:queues:
    desc: "Queue semantics: distribution, redelivery, dead letters, and their cost"
    cmds: ["cargo run --release -p broker --bin queue-semantics-demo -- {{.CLI_ARGS}}"]
  demo:check:
    desc: "Build the standalone demo crates and run their behavioural tests"
    cmds:
      - "cargo fmt --manifest-path demos/slow-consumer/Cargo.toml -- --check"
      - "cargo fmt --manifest-path demos/state-divergence/Cargo.toml -- --check"
      - "cargo clippy --manifest-path demos/slow-consumer/Cargo.toml --all-targets -- -D warnings"
      - "cargo clippy --manifest-path demos/state-divergence/Cargo.toml --all-targets -- -D warnings"
      - "cargo build --manifest-path demos/slow-consumer/Cargo.toml"
      - "cargo build --manifest-path demos/state-divergence/Cargo.toml"
      - "cargo build --manifest-path demos/rbac-live/Cargo.toml"
      - "cargo build --manifest-path demos/cross_tenant_isolation/Cargo.toml"
      - "cargo test --manifest-path demos/slow-consumer/Cargo.toml"
      - "cargo test --manifest-path demos/state-divergence/Cargo.toml"
      # The queue demo asserts every guarantee it narrates and bails on any
      # violation, so running it is the behavioural test. It is deterministic:
      # it drives the visibility timeout itself rather than sleeping.
      - "cargo run -q -p broker --bin queue-semantics-demo"
  demo:state-divergence:
    desc: "Counterpart demo: what at-most-once costs a consumer holding local state"
    cmds:
      - "cargo run --release --manifest-path demos/state-divergence/Cargo.toml -- {{.CLI_ARGS}}"
  demo:slow-consumer:
    desc: "Flagship demo: one slow consumer does not degrade the healthy ones"
    cmds:
      - "cargo run --release --manifest-path demos/slow-consumer/Cargo.toml -- {{.CLI_ARGS}}"
  demo:rbac-live:
    cmds:
      - "cargo run --manifest-path demos/rbac-live/Cargo.toml -- {{.CLI_ARGS}}"
  demo:cross-tenant-isolation:
    cmds:
      - "task pg:down"
      - "task pg:up"
      - "cargo run --manifest-path demos/cross_tenant_isolation/Cargo.toml -- {{.CLI_ARGS}}"
      - "task pg:down"
  perf:deps:
    desc: "Create .venv-perf and install the Python deps the charting pipeline needs"
    cmds:
      # A virtualenv rather than a bare `pip install`: Homebrew and most distro
      # Pythons are marked externally managed (PEP 668), so installing into them
      # fails outright. Everything below prefers this venv when it exists and
      # falls back to system python3 otherwise, so nothing is required of a
      # machine where the deps happen to be installed already.
      - "python3 -m venv .venv-perf"
      - ".venv-perf/bin/python -m pip install --quiet --upgrade pip"
      - ".venv-perf/bin/python -m pip install --quiet -r scripts/perf/requirements.txt"
      - '.venv-perf/bin/python -c "import matplotlib; print(f\"matplotlib {matplotlib.__version__} ready in .venv-perf\")"'
  perf:charts:
    desc: "Re-render charts from data already in data/derived (no benchmark run)"
    cmds:
      - |
        PY=$([ -x .venv-perf/bin/python ] && echo .venv-perf/bin/python || echo python3)
        "$PY" scripts/perf/make_charts.py
        "$PY" scripts/perf/render_markdown_snippets.py
  perf:latency-matrix:
    cmds:
      - |
        PY=$([ -x .venv-perf/bin/python ] && echo .venv-perf/bin/python || echo python3)
        "$PY" scripts/perf/run_latency_matrix.py
        "$PY" scripts/perf/normalize_and_aggregate.py
        "$PY" scripts/perf/make_charts.py
        "$PY" scripts/perf/render_markdown_snippets.py
  perf:fast:
    desc: "Fast chart pass (~15-20 min vs hours): one profile, 5 presets, 3 trials; only the two chart-bearing shapes (acked-latency json batch=1, sustained-throughput binary batch=64)"
    cmds:
      - |
        PY=$([ -x .venv-perf/bin/python ] && echo .venv-perf/bin/python || echo python3)
        # One shared session id so both filtered halves aggregate together;
        # normalize_and_aggregate keeps only the latest session by default.
        export FELIX_PERF_SESSION_ID=$(uuidgen | tr 'A-Z' 'a-z')
        "$PY" scripts/perf/run_latency_matrix.py --config scripts/perf/fast.yml --filter 'batch=1,binary=False'
        "$PY" scripts/perf/run_latency_matrix.py --config scripts/perf/fast.yml --filter 'batch=64,binary=True'
        "$PY" scripts/perf/normalize_and_aggregate.py
        "$PY" scripts/perf/make_charts.py --config scripts/perf/fast.yml
        "$PY" scripts/perf/render_markdown_snippets.py --config scripts/perf/fast.yml
  cluster:up:
    desc: Start a local three-node cluster and hold it until Ctrl-C.
    cmds:
      - cargo build -p broker --bin felix-broker
      - cargo run -p felix-cluster -- up {{.CLI_ARGS}}
  cluster:status:
    desc: Start a cluster, print membership and shard ownership, then tear it down.
    cmds:
      - cargo build -p broker --bin felix-broker
      - cargo run -p felix-cluster -- status {{.CLI_ARGS}}
  cluster:smoke:
    desc: Publish through a non-owner and receive from the owner.
    cmds:
      - cargo build -p broker --bin felix-broker
      - cargo run -p felix-cluster -- smoke {{.CLI_ARGS}}
  cluster:subscribe:
    desc: Stream events from a running cluster (start one with cluster:up).
    cmds: ["cargo run -q -p felix-cluster -- subscribe {{.CLI_ARGS}}"]
  cluster:publish:
    desc: Publish to a running cluster, through a broker that does not own the shard.
    cmds: ["cargo run -q -p felix-cluster -- publish {{.CLI_ARGS}}"]
  cluster:demo:
    desc: "Cross-broker demo in ONE pane, start to finish (see cluster:demo:tmux for three)."
    cmds:
      - cargo build -p broker --bin felix-broker
      - cargo run -q -p felix-cluster -- demo {{.CLI_ARGS}}
  cluster:failover:
    desc: "Replication, quorum acks and failover: kill the leader, keep publishing."
    cmds:
      - cargo run -q -p felix-cluster --bin felix-cluster -- failover {{.CLI_ARGS}}

  cluster:consistency:
    desc: "What Quorum buys and what Leader costs, under one fault"
    cmds:
      - cargo build -p broker --bin felix-broker
      - cargo run -q -p felix-cluster --bin felix-cluster -- consistency {{.CLI_ARGS}}

  cluster:demo:tmux:
    desc: The same demo across THREE tmux panes - cluster, subscriber, publisher.
    cmds:
      - cargo build -p broker --bin felix-broker
      - cargo build -p felix-cluster
      - scripts/cluster-demo-tmux.sh
  cluster:burst:
    desc: Publish a burst of messages to a running cluster, across every broker.
    cmds: ["scripts/cluster-publish-loop.sh"]
  cluster:owners:
    desc: Who leads each shard of a running cluster.
    cmds: ["cargo run -q -p felix-cluster -- owners"]
  cluster:test:
    desc: Cross-broker integration tests against a real three-node cluster.
    cmds: ["cargo test -p felix-cluster"]
  conformance:
    cmds: ["cargo run -p felix-conformance"]
