# A throwaway spike for #488: how much of the Kafka wire protocol does a real
# client need before it can read a Felix stream?
#
# Outside the workspace on purpose. This is evidence, not a product: it is here
# to be measured and then deleted or promoted, and it must not become something
# `task lint` keeps alive by habit.
[package]
name = "felix-kafka-shim-spike"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
# CRC-32C (Castagnoli), which the v2 record batch requires and `crc32fast`
# (IEEE) is not. Clients validate it, so this is not optional.
crc = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# A real Felix broker, behind the shim. AGPL-3.0, like anything that embeds the
# broker — which is one of the things a shim would have to decide, since it
# would ship as part of Felix rather than beside it.
felix-broker = { path = "../../crates/server/felix-broker" }
felix-storage = { path = "../../crates/server/felix-storage" }

[workspace]
