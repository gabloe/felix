{{- if .Values.broker.enabled }}
{{- $b := .Values.broker }}
{{- $name := include "felix.broker.fullname" . }}
{{- $listeners := int (default 1 $b.ports.listeners) }}
# Stable per-broker names: what discovery hands clients, and what a client
# that followed a redirect connects to.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "felix.broker.headless" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "felix.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  clusterIP: None
  ports:
    {{- range $offset := until $listeners }}
    - name: {{ if eq $offset 0 }}quic{{ else }}quic-{{ $offset }}{{ end }}
      port: {{ add (int $b.ports.client) $offset }}
      targetPort: {{ if eq $offset 0 }}quic{{ else }}quic-{{ $offset }}{{ end }}
      protocol: UDP
    {{- end }}
    - name: internal
      port: {{ int $b.ports.internal }}
      targetPort: internal
      protocol: UDP
    - name: metrics
      port: {{ int $b.ports.metrics }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "felix.broker.selectorLabels" . | nindent 4 }}
{{- if $b.clientService.enabled }}
---
# A first hop for clients. Any broker answers a first connection with
# discovery, so which one the Service picks does not matter; the internal
# port is deliberately not here.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "felix.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
  {{- with $b.clientService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $b.clientService.type }}
  ports:
    {{- range $offset := until $listeners }}
    - name: {{ if eq $offset 0 }}quic{{ else }}quic-{{ $offset }}{{ end }}
      port: {{ add (int $b.clientService.port) $offset }}
      targetPort: {{ if eq $offset 0 }}quic{{ else }}quic-{{ $offset }}{{ end }}
      protocol: UDP
    {{- end }}
  selector:
    {{- include "felix.broker.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
