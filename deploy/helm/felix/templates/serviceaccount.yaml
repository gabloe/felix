{{- if .Values.serviceAccount.create }}
# Neither workload talks to the Kubernetes API; the account exists so the
# pods do not run as `default`, and its token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "felix.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "felix.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
